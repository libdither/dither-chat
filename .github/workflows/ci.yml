# Typecheck, tests and the web build on each push and pull request, as parallel jobs behind the one required check,
# `check`. Everything runs against fakes (a fake signal-cli, a fake WhatsApp bridge, a replica of Discord's client,
# in-memory hubs), so no network binaries are needed. The remote-account tests (hub test/remote.test.ts) need a
# dither-accounts checkout beside this one and skip here. The hub's tests also start it on databases older hubs left
# (test/old-database.test.ts).
# A pull request that only changes docs (*.md, docs/) or the Android app skips the work (scripts/ci-changes.ts); a push
# to main and a manual run always run everything. The same locally: bun run typecheck, bun run test, bun run web:build,
# bun run check:boot, bun scripts/verify-login.ts, bun scripts/verify-clear.ts, bun run check:offline,
# bun scripts/verify-offline.ts, bun scripts/verify-back.ts, bun scripts/verify-perf.ts --ci.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      # A pull request checks out its merge commit; the parent is enough to see what it changes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: changes
        run: bun scripts/ci-changes.ts --github

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD^1 too: the budget tests (scripts/budgets.ts) fail a budget raised since it without a reason.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # No .only, retries or bare skips, and no new real-time waits in tests (scripts/check-tests.ts, docs/testing.md).
      - run: bun run check:tests
      # A component's stylesheet styles only its own classes (scripts/check-css.ts, docs/testing.md "Stylesheets").
      - run: bun run check:css
      # No import cycles in a package (scripts/check-cycles.ts), no unused files or dependencies and no unlisted
      # imports (knip.json); docs/testing.md "Checks across the code".
      - run: bun run check:cycles
      - run: bun run knip
      # Every Escape handler says it took the key, and verify-back.ts covers every page and layer (scripts/check-escape.ts,
      # docs/desktop.md "Escape and back").
      - run: bun run check:escape

  # The hub's suite is the longest; its files run on --parallel workers (scripts/test-all.ts). All but mail-load's,
  # which runs beside it in test-hub-mail.
  test-hub:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/test-all.ts hub -- --path-ignore-patterns=test/mail-load.test.ts

  # The hub's mail-load tests on a runner of their own: 60k messages into SQLite take 20 to 30 s, as long as the rest of
  # the hub's suite on four workers.
  test-hub-mail:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/test-all.ts hub -- test/mail-load.test.ts

  test-packages:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/test-all.ts --except hub

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run web:build

  # The built web app in the runner's Google Chrome against a demo hub, at a desktop's and a phone's size: fails on a
  # page error, a console.error, a failed request or no service worker (scripts/check-boot.ts). Then the sign-in screen,
  # and the start with the hub out of reach right after a deploy (scripts/check-offline.ts).
  boot:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A fresh runner's first browser start reads its 670 MB from a cold disk (11 to 35 s, then half a second): read
      # them in the background while the rest installs. scripts/browser.ts waits up to 90 s for it either way.
      - run: b=$(command -v chromium || command -v google-chrome) && (find -L "$(dirname "$(readlink -f "$b")")" -type f -print0 | xargs -0 cat > /dev/null 2>&1 &) || true
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check:boot
      # The sign-in screen on a cold start, clicked and typed into, against a hub behind the login (docs/login.md).
      - run: bun run web:build && bun scripts/verify-login.ts
      # A notification closes once its chat is read, here or on another device, pushes delivered to the service worker
      # over DevTools (docs/notifications.md, "Read elsewhere, gone here").
      - run: bun scripts/verify-clear.ts
      # The first start after a deploy with the hub out of reach: from the snapshot, every file from the service worker's
      # cache, and a start that could not load comes back by itself once the hub does.
      - run: bun scripts/check-offline.ts --web packages/web/dist
      # The hub out of reach (docs/sync.md, "Quiet"), on the same build: a demo hub stopped and started again, the amber
      # orb and its popover on a phone and a computer, the line over the message box, a send that waits and goes out once.
      - run: bun scripts/verify-offline.ts

  # Back from every kind of page and layer, by Escape and the browser's back, on a computer and a phone, against a demo
  # hub of its own (scripts/verify-back.ts, docs/desktop.md "Escape and back").
  back:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: b=$(command -v chromium || command -v google-chrome) && (find -L "$(dirname "$(readlink -f "$b")")" -type f -print0 | xargs -0 cat > /dev/null 2>&1 &) || true
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run web:build && bun scripts/verify-back.ts

  # Load and chat switching on a tenth-size world in the runner's browser, a warm-up and then one run: renders, DOM
  # nodes and bytes against scripts/perf-baseline-ci.json; its times go in the job's summary and are never judged
  # (docs/perf.md, "In CI").
  # The longest job, so it does not wait the 10 s or so for `changes`: it starts at once, asks the same script, and
  # skips its steps when `changes` would skip it (then it passes, where the others read as skipped).
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The browser's files from a cold disk in the background, as in boot.
      - run: b=$(command -v chromium || command -v google-chrome) && (find -L "$(dirname "$(readlink -f "$b")")" -type f -print0 | xargs -0 cat > /dev/null 2>&1 &) || true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: changes
        run: bun scripts/ci-changes.ts --github
      - if: steps.changes.outputs.code == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.code == 'true'
        run: bun scripts/verify-perf.ts --ci

  # Branch protection requires this job by name. It passes only when every job passed, or was skipped because
  # `changes` said the pull request does not need it. It runs on failure and cancellation too, so it never reads as
  # skipped (which GitHub would count as passed).
  check:
    needs: [changes, typecheck, test-hub, test-hub-mail, test-packages, web, boot, back, perf]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          code=$(jq -r '.changes.outputs.code // ""' <<<"$NEEDS")
          bad=$(jq -r --arg code "$code" 'to_entries[] | select(.value.result != "success" and (.key == "changes" or .value.result != "skipped" or $code != "false")) | .key' <<<"$NEEDS")
          if [ -n "$bad" ]; then echo "not passed: $(echo $bad)"; exit 1; fi
          echo "code=$code: all passed"
